name: Live leaderboard

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay runs a little)
  workflow_dispatch: # "Run workflow" button for a manual update

permissions:
  contents: write # to save message_id.txt after the first post

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update the Discord leaderboard
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node leaderboard.mjs

      - name: Save the message id after the first post
        run: |
          if [ -n "$(git status --porcelain message_id.txt)" ]; then
            git config user.name "reilcored-leaderboard"
            git config user.email "actions@users.noreply.github.com"
            git add message_id.txt
            git commit -m "Save leaderboard message id"
            git push
          fi
